set -g mouse on

set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

unbind C-b
set-option -g prefix M-j
bind-key M-j send-prefix

bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# bind-key k run-shell "~/.config/tmux/tmux_window_manager.sh"
# bind-key k display-popup -E "~/.config/tmux/tmux_window_manager.sh"
bind-key k display-popup -E "~/.config/tmux/tmux_session_manager.sh"
# bind-key k display-popup -E "tms"

set-option -g allow-rename off

# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'


# Theme config

set -g @catppuccin_window_status_style "none"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -ag status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse] "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(/Users/gglamer/.config/tmux/plugins/tmux/custom/cpu_temp)˚"


run '~/.config/tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default
